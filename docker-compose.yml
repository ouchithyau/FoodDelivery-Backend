version: '3.8'

services:
  # PostgreSQL Database
  postgres-db:
    image: postgres:latest
    container_name: fooddelivery-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2002 
      POSTGRES_DB: FoodDeliveryDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # RabbitMQ 
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fooddelivery-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" 

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: fooddelivery-auth-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=FoodDeliveryDb;Username=postgres;Password=2002
      - JwtSettings__Secret=SuperDuperSecretKeyForFoodDeliveryApp2026SecureKey!
      - JwtSettings__Issuer=FoodDeliveryAuthAPI
      - JwtSettings__Audience=FoodDeliveryClients
    depends_on:
      - postgres-db

      # Support Service
  support-service:
    build:
      context: ./services/support-service
      dockerfile: Dockerfile
    container_name: fooddelivery-support-api
    ports:
      - "5002:8080" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=FoodDeliveryDb;Username=postgres;Password=2002
      - JwtSettings__Secret=SuperDuperSecretKeyForFoodDeliveryApp2026SecureKey!
      - JwtSettings__Issuer=FoodDeliveryAuthAPI
      - JwtSettings__Audience=FoodDeliveryClients
    depends_on:
      - postgres-db

      # Restaurant Service
  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    container_name: fooddelivery-restaurant-api
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=FoodDeliveryDb;Username=postgres;Password=2002
      - JwtSettings__Secret=SuperDuperSecretKeyForFoodDeliveryApp2026SecureKey!
      - JwtSettings__Issuer=FoodDeliveryAuthAPI
      - JwtSettings__Audience=FoodDeliveryClients
    depends_on:
      - postgres-db

  # Ordering Service
  ordering-service:
    build:
      context: ./services/ordering-service
      dockerfile: Dockerfile
    container_name: fooddelivery-ordering-api
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=FoodDeliveryDb;Username=postgres;Password=2002
      - JwtSettings__Secret=SuperDuperSecretKeyForFoodDeliveryApp2026SecureKey!
      - JwtSettings__Issuer=FoodDeliveryAuthAPI
      - JwtSettings__Audience=FoodDeliveryClients
    depends_on:
      - postgres-db
      - rabbitmq

  # Logistics Service
  logistics-service:
    build:
      context: ./services/logistics-service
      dockerfile: Dockerfile
    container_name: fooddelivery-logistics-api
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=FoodDeliveryDb;Username=postgres;Password=2002
      - JwtSettings__Secret=SuperDuperSecretKeyForFoodDeliveryApp2026SecureKey!
      - JwtSettings__Issuer=FoodDeliveryAuthAPI
      - JwtSettings__Audience=FoodDeliveryClients
    depends_on:
      - postgres-db
      - rabbitmq

  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: fooddelivery-payment-api
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=FoodDeliveryDb;Username=postgres;Password=2002
      - JwtSettings__Secret=SuperDuperSecretKeyForFoodDeliveryApp2026SecureKey!
      - JwtSettings__Issuer=FoodDeliveryAuthAPI
      - JwtSettings__Audience=FoodDeliveryClients
    depends_on:
      - postgres-db

        # YARP API Gateway
  api-gateway:
    build:
      context: ./api-gateway/FoodDelivery.ApiGateway
      dockerfile: Dockerfile
    container_name: fooddelivery-api-gateway
    ports:
      - "7121:8080" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - auth-service
      - support-service
      - restaurant-service
      - ordering-service
      - payment-service
      - logistics-service

volumes:
  postgres-data:

  